version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: discord-bot-postgres
    environment:
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme}
      POSTGRES_DB: discord_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bot-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: discord-bot-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bot-network

  # Discord Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_APP_ID: ${DISCORD_APP_ID}
      DATABASE_URL: postgresql://bot_user:${DATABASE_PASSWORD:-changeme}@postgres:5432/discord_bot
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - bot-network

  # Dashboard Backend (Optional - Uncomment to enable)
  # dashboard-backend:
  #   build:
  #     context: ./dashboard/backend
  #     dockerfile: Dockerfile
  #   container_name: discord-bot-dashboard-backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql://bot_user:${DATABASE_PASSWORD:-changeme}@postgres:5432/discord_bot
  #     REDIS_URL: redis://redis:6379/0
  #     DASHBOARD_SECRET_KEY: ${DASHBOARD_SECRET_KEY}
  #     DASHBOARD_HOST: ${DASHBOARD_HOST:-0.0.0.0}
  #     DASHBOARD_PORT: ${DASHBOARD_BACKEND_INTERNAL_PORT:-8080}
  #     BOT_OWNER_ID: ${BOT_OWNER_ID}
  #     DASHBOARD_DISCORD_CLIENT_ID: ${DASHBOARD_DISCORD_CLIENT_ID}
  #     DASHBOARD_DISCORD_CLIENT_SECRET: ${DASHBOARD_DISCORD_CLIENT_SECRET}
  #     DASHBOARD_DISCORD_REDIRECT_URI: ${DASHBOARD_DISCORD_REDIRECT_URI}
  #   ports:
  #     - "${DASHBOARD_BACKEND_PORT:-8080}:${DASHBOARD_BACKEND_INTERNAL_PORT:-8080}"
  #   restart: unless-stopped
  #   networks:
  #     - bot-network

  # Dashboard Frontend (Optional - Uncomment to enable)
  # dashboard-frontend:
  #   build:
  #     context: ./dashboard/frontend
  #     dockerfile: Dockerfile
  #   container_name: discord-bot-dashboard-frontend
  #   depends_on:
  #     - dashboard-backend
  #   ports:
  #     - "${DASHBOARD_FRONTEND_PORT:-3000}:3000"
  #   environment:
  #     VITE_API_URL: ${DASHBOARD_API_URL:-http://localhost:8080}
  #   restart: unless-stopped
  #   networks:
  #     - bot-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bot-network:
    driver: bridge
